name: release-build

on:
  # The tag-triggered release.yml builds through this workflow, so a release
  # ships the programs this exact pipeline built and smoke-tested.
  workflow_call:
    inputs:
      version:
        description: Version stamped into each program
        required: true
        type: string
      # release.yml runs the smoke itself, after its prerelease exists: a final
      # build checks itself against its own GitHub Release's SHA256SUMS.
      skip_smoke:
        description: Leave the smoke to the caller
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: Version stamped into each program
        required: true
        type: string
  # A draft pull request proves the pipeline with a candidate version before
  # the workflow is in place on main, where workflow_dispatch can see it.
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  # The draft pull request path has no version input, so it builds this one
  # candidate. workflow_dispatch supplies its own version.
  DRAFT_PR_VERSION: 0.1.0-rc.1

jobs:
  build:
    name: build (${{ matrix.target }})
    if: inputs.version != '' || github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each runner matches its target, so the C compiler builds sqlite3mc
          # for the platform the program will run on.
          - target: darwin-arm64
            os: macos-latest
          - target: darwin-x64
            os: macos-15-intel
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: windows-x64
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "value=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "value=$DRAFT_PR_VERSION" >> "$GITHUB_OUTPUT"
          fi

      # The same steps build the WSL workflow's programs. A composite action's
      # steps take no limit of their own, so this one bounds them all.
      - name: Build the program
        timeout-minutes: 25
        uses: ./.github/actions/build-program
        with:
          target: ${{ matrix.target }}
          version: ${{ steps.version.outputs.value }}
          github-token: ${{ github.token }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kinfold-${{ matrix.target }}
          path: dist/kinfold-*
          if-no-files-found: error

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # The installer accepts exactly "64 lowercase hex characters, two spaces,
      # the asset name". Text mode states that format instead of inheriting the
      # platform default, and binary mode would add a "*" before the name.
      - name: Write SHA256SUMS
        shell: bash
        run: |
          cd dist
          sha256sum --text kinfold-* | sort -k2 > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kinfold-programs
          path: dist/
          if-no-files-found: error

  # The same run's artifact, so the programs are the ones just built and the
  # local SHA256SUMS is the list the self-check reads.
  smoke:
    name: smoke
    needs: checksums
    if: ${{ !inputs.skip_smoke }}
    uses: ./.github/workflows/smoke.yml
