name: release

# A v<version> tag on main (or a prerelease tag on beta) builds every program
# once and publishes those bytes as a GitHub prerelease. The smoke then installs
# them on each OS against that real Release, because a final build checks itself
# against its own Release's SHA256SUMS and accepts no other list. Only then is
# the Release promoted to latest and the same bytes published to npm through
# trusted publishing. A failed smoke deletes the prerelease and publishes nothing.
# The npm trusted-publisher configs name this file, so renaming it breaks npm
# publishing.
# version.yml pushes the tag with GITHUB_TOKEN, and a tag pushed that way starts
# no workflow, so it dispatches this one on the tag. A tag pushed by hand still
# runs it through the push trigger.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read the version from the tag
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "$TAG is a $REF_TYPE; run this workflow on a v<version> tag"
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "$TAG is not v<major>.<minor>.<patch>[-<prerelease>]"
            exit 1
          fi
          version="${TAG#v}"
          if [ "$version" = "0.0.0-dev" ]; then
            echo "0.0.0-dev is the development version, which skips the checksum check"
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # A tag on a branch that never merged would publish code main never had.
      # Prereleases come from the beta branch, which runs changesets pre mode.
      - name: Confirm the tagged commit is on main, or a prerelease on beta
        shell: bash
        env:
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then exit 0; fi
          if [ "$PRERELEASE" = "true" ] && git show-ref --quiet refs/remotes/origin/beta \
            && git merge-base --is-ancestor "$GITHUB_SHA" origin/beta; then exit 0; fi
          echo "the tagged commit is not on main (or, for a prerelease, on beta)"
          exit 1

  build:
    name: build
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.check.outputs.version }}
      skip_smoke: true

  # The jobs that publish run in the 'release' environment, so each one waits
  # for the maintainer's "Approve and deploy". Builds and the smoke do not.
  github-release:
    name: GitHub Release
    needs: [check, build]
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kinfold-programs
          path: dist

      - name: Check the programs against SHA256SUMS
        shell: bash
        run: cd dist && sha256sum --check SHA256SUMS

      - name: Install the pinned Bun
        shell: bash
        env:
          # Anonymous API calls share a rate limit per runner address and answer 403.
          GH_TOKEN: ${{ github.token }}
        run: bash tools/install-bun.sh

      # The notes leave dist/ so that only programs, SHA256SUMS and the install
      # scripts are uploaded as release assets.
      - name: Write the release notes
        shell: bash
        run: |
          bun tools/release-notes.ts dist "$VERSION"
          mv dist/RELEASE_NOTES.md "$RUNNER_TEMP/RELEASE_NOTES.md"

      - name: Add the install scripts
        shell: bash
        run: cp scripts/install.sh scripts/install.ps1 dist/

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A prerelease until the smoke passes, so /releases/latest never
          # points at programs no install has run yet.
          gh release create "v$VERSION" dist/* --verify-tag --prerelease --title "Kinfold $VERSION" \
            --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md"

  smoke:
    name: smoke
    needs: [check, github-release]
    permissions:
      contents: read
    uses: ./.github/workflows/smoke.yml

  promote:
    name: promote the Release
    needs: [check, smoke]
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      # A release candidate stays a prerelease; a final version becomes latest.
      - name: Mark the Release as latest
        if: needs.check.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$VERSION" --prerelease=false --latest --repo "$GITHUB_REPOSITORY"

  # The tag stays. After a discard, "Re-run all jobs" makes the prerelease
  # again; rerunning only the failed jobs would smoke a Release that is gone.
  # After a promote, the Release stays, so a failed npm publish is finished
  # with "Re-run failed jobs" instead.
  discard:
    name: discard the prerelease
    needs: [check, github-release, smoke]
    if: (failure() || cancelled()) && needs.github-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Delete the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v$VERSION" --yes --repo "$GITHUB_REPOSITORY"

  npm-publish:
    name: npm publish
    needs: [check, build, promote]
    # npm's trusted publisher for every package names this environment, so a
    # publish from any other job is refused.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Trusted publishing needs npm 11.5.1 or later. registry-url points npm at
      # the registry; with no token set, npm exchanges this job's OIDC token.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # An exact version, because this job holds the OIDC token: a new npm
      # release must not run here before someone has chosen it.
      - name: Update npm
        run: npm install -g npm@11.21.3

      - name: Install the pinned Bun
        shell: bash
        env:
          # Anonymous API calls share a rate limit per runner address and answer 403.
          GH_TOKEN: ${{ github.token }}
        run: bash tools/install-bun.sh

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kinfold-programs
          path: dist

      - name: Check the programs against SHA256SUMS
        shell: bash
        run: cd dist && sha256sum --check SHA256SUMS

      - name: Pack the npm packages
        shell: bash
        run: bun tools/pack-npm.ts dist "$VERSION"

      # The platform packages go first, so the launcher never names a package
      # that is not there yet. A version already on npm is skipped, which lets a
      # rerun finish a publish that stopped partway.
      - name: Publish
        shell: bash
        run: |
          tag=latest
          if [ "$PRERELEASE" = "true" ]; then tag=next; fi
          publish() {
            name=$(node -p "require('./$1/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already on npm"
              return
            fi
            (cd "$1" && npm publish --provenance --access public --tag "$tag")
          }
          publish dist/npm/cli-darwin-arm64
          sleep 3
          publish dist/npm/cli-darwin-x64
          sleep 3
          publish dist/npm/cli-linux-x64
          sleep 3
          publish dist/npm/cli-linux-arm64
          sleep 3
          publish dist/npm/cli-windows-x64
          sleep 3
          publish dist/npm/kinfold
