name: smoke

# Called by release-build after the checksums job, so the same run's artifact
# is the program and SHA256SUMS under test.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # One entry per release target. An OS runs the smoke once it has both
        # tools/smoke/<smoke>.ts and .github/smoke/<smoke>.sh; until then its
        # entries stop green after the gate.
        include:
          - os: macos-latest
            target: darwin-arm64
            smoke: macos
          - os: macos-15-intel
            target: darwin-x64
            smoke: macos
          - os: ubuntu-latest
            target: linux-x64
            smoke: linux
          - os: ubuntu-24.04-arm
            target: linux-arm64
            smoke: linux
          - os: windows-latest
            target: windows-x64
            smoke: windows
    steps:
      - uses: actions/checkout@v5

      - name: Check for this OS's smoke steps
        id: gate
        shell: bash
        env:
          SMOKE: ${{ matrix.smoke }}
        run: |
          if [ -f "tools/smoke/$SMOKE.ts" ] && [ -f ".github/smoke/$SMOKE.sh" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no smoke steps for $SMOKE yet"
          fi

      - name: Install the pinned Bun
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        env:
          # Anonymous API calls share a rate limit per runner address and answer 403.
          GH_TOKEN: ${{ github.token }}
        run: bash tools/install-bun.sh

      - name: Download the release programs
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: kinfold-programs
          path: dist

      # The artifact archive keeps the bytes, not the mode, so the downloaded
      # programs arrive without the executable bit.
      - name: Make the programs executable
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: chmod +x dist/kinfold-*

      - name: Set up the runner for the smoke
        if: steps.gate.outputs.enabled == 'true'
        timeout-minutes: 30
        shell: bash
        env:
          SMOKE: ${{ matrix.smoke }}
        run: bash ".github/smoke/$SMOKE.sh" setup

      - name: Smoke the built program
        if: steps.gate.outputs.enabled == 'true'
        timeout-minutes: 25
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          program="dist/kinfold-$TARGET"
          if [ "$RUNNER_OS" = "Windows" ]; then program="$program.exe"; fi
          test -f "$program"
          test -f dist/SHA256SUMS
          KINFOLD_RELEASE_SUMS_URL="file://$PWD/dist/SHA256SUMS" bun tools/smoke.ts "$program"

      - name: Show the daemon log
        if: always() && steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          if [ -f "$HOME/.kinfold/logs/daemon.log" ]; then
            echo "daemon log"
            cat "$HOME/.kinfold/logs/daemon.log"
          else
            echo "the daemon log is missing"
          fi

      - name: Clean up the runner
        if: always() && steps.gate.outputs.enabled == 'true'
        shell: bash
        env:
          SMOKE: ${{ matrix.smoke }}
        run: bash ".github/smoke/$SMOKE.sh" cleanup
