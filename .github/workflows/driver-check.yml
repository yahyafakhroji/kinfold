name: driver-check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/sqlite/**'
      - 'tools/**'
      - '.bun-version'
      - '.github/workflows/driver-check.yml'

permissions:
  contents: read

jobs:
  driver-check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Build sqlite3mc
        run: bun tools/build-sqlite3mc.ts

      - name: Compile the driver check
        shell: bash
        run: |
          program=driver-check
          if [ "$RUNNER_OS" = "Windows" ]; then program=driver-check.exe; fi
          bun build --compile tools/driver-check.ts --outfile "$program"

      - name: Run the compiled program
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) library=.cache/sqlite3mc/libsqlite3mc.dylib; program=driver-check ;;
            Linux) library=.cache/sqlite3mc/libsqlite3mc.so; program=driver-check ;;
            Windows) library=.cache/sqlite3mc/libsqlite3mc.dll; program=driver-check.exe ;;
          esac
          "./$program" "$library"
