name: wsl

# The WSL smoke for a risky branch, run by hand before the release:
# gh workflow run wsl --ref <branch>. It builds only the two programs WSL
# needs. The release runs the WSL smoke through smoke.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: 0.1.0-rc.1

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: windows-x64
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the program
        timeout-minutes: 25
        uses: ./.github/actions/build-program
        with:
          target: ${{ matrix.target }}
          version: ${{ env.VERSION }}
          github-token: ${{ github.token }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kinfold-${{ matrix.target }}
          path: dist/kinfold-*
          if-no-files-found: error

  programs:
    name: programs
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # The format release-build's checksums job writes; install checks the
      # program it copies against this list.
      - name: Write SHA256SUMS
        shell: bash
        run: |
          cd dist
          sha256sum --text kinfold-* | sort -k2 > SHA256SUMS
          sha256sum --check SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kinfold-programs
          path: dist/
          if-no-files-found: error

  smoke:
    name: smoke
    needs: programs
    uses: ./.github/workflows/wsl-smoke.yml
