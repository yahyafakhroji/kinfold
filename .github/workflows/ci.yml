name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A job that reaches its own timeout is cancelled, and continue-on-error
    # does not absorb a cancelled job, so the job limit only backstops the
    # tighter step limits that bound each long step.
    timeout-minutes: 30
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        # Each OS's line is flipped to required by the change that brings it
        # up; the os line between keeps two such changes from touching
        # neighbouring lines.
        include:
          - os: macos-latest
            required: true
          - os: ubuntu-latest
            required: true
          - os: windows-latest
            required: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install development dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile

      - name: Build sqlite3mc for the test preload
        timeout-minutes: 8
        env:
          # Lets the API asset fallback authenticate; anonymous calls hit a shared rate limit.
          GH_TOKEN: ${{ github.token }}
        run: bun tools/build-sqlite3mc.ts

      # Fetches the pinned build for the runner's platform and exports
      # KINFOLD_TEST_VEC0, so the contract and integration tests load the real
      # extension instead of skipping. Every Kinfold target has a pinned build.
      - name: Fetch the pinned sqlite-vec build
        timeout-minutes: 3
        env:
          # Lets the API asset fallback authenticate; anonymous calls hit a shared rate limit.
          GH_TOKEN: ${{ github.token }}
        run: bun tools/fetch-vec0.ts

      # Exports KINFOLD_TEST_MODEL_DIR, so the tokenizer, model and embed
      # worker tests run the real bundled model instead of skipping.
      - name: Fetch the pinned embedding model
        timeout-minutes: 5
        run: bun tools/fetch-model.ts

      # 20 s per test: the 5 s default trips timing-sensitive daemon tests on
      # shared runners. Windows never delivers the 5 ms abort that
      # src/mcp/semantic-client.test.ts and src/vectors/embedder.test.ts await,
      # and the per-test timeout cannot end that await, so those two files are
      # skipped there and every other file still reports.
      # The Windows runner takes 9 to 11 minutes on a good run and has slow stretches, so it gets 20; the others keep 12.
      - name: Test
        timeout-minutes: ${{ matrix.os == 'windows-latest' && 20 || 12 }}
        shell: bash
        run: |
          ignore=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            ignore=(--path-ignore-patterns '**/semantic-client.test.ts' --path-ignore-patterns '**/embedder.test.ts')
          fi
          bun test --timeout 20000 "${ignore[@]}"

  types:
    name: types (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        # Each OS's line is flipped to required by the change that brings it
        # up; the os line between keeps two such changes from touching
        # neighbouring lines.
        include:
          - os: macos-latest
            required: true
          - os: ubuntu-latest
            required: true
          - os: windows-latest
            required: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install development dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile

      # bun run uses the TypeScript installed from the lockfile; bunx could
      # download a different compiler when node_modules is incomplete.
      - name: Typecheck
        timeout-minutes: 5
        run: bun run typecheck

  # A change that reaches users carries a changeset, which becomes its changelog
  # line and its version bump. tools/changesets.ts says which paths count.
  changeset:
    name: changeset
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Check the changeset
        shell: bash
        run: bun tools/changesets.ts check "origin/$GITHUB_BASE_REF"
