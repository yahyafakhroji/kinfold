# PROBE (windows sweep stall): runs the upkeep stall test many times on
# Windows to catch the slice that holds the thread for seconds, alone and
# inside the full suite. Removed before anything merges.
name: probe-sweep-stall

on:
  push:
    branches:
      - probe/windows-sweep-stall
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.mode }} ${{ matrix.run }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: alone, run: 1 }
          - { mode: alone, run: 2 }
          - { mode: alone, run: 3 }
          - { mode: alone, run: 4 }
          - { mode: suite, run: 1 }
          - { mode: suite, run: 2 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install development dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile

      - name: Build sqlite3mc for the test preload
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun tools/build-sqlite3mc.ts

      - name: Fetch the pinned sqlite-vec build
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun tools/fetch-vec0.ts

      - name: Fetch the pinned embedding model
        timeout-minutes: 5
        run: bun tools/fetch-model.ts

      - name: Stall test, alone, five times
        if: matrix.mode == 'alone'
        timeout-minutes: 20
        shell: bash
        run: |
          failed=0
          for i in 1 2 3 4 5; do
            echo "::group::round $i"
            bun test --timeout 20000 src/daemon/upkeep-stall.test.ts || failed=$((failed + 1))
            echo "::endgroup::"
          done
          echo "rounds failed: $failed of 5"
          [ "$failed" -eq 0 ]

      - name: Full suite
        if: matrix.mode == 'suite'
        timeout-minutes: 20
        shell: bash
        run: bun test --timeout 20000 --path-ignore-patterns '**/semantic-client.test.ts' --path-ignore-patterns '**/embedder.test.ts'
